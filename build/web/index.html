<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a browser other than the default one in your
    computer, set the value of the base tag to &quot;/&quot;. In Flutter, the
    base tag is only used for setting the base path for static assets.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Digital Vault Heritage v3.0 - Enterprise-grade secure digital vault with AES-256 encryption, Dead Man's Switch, and multi-language support.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Digital Vault Heritage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Digital Vault Heritage v3.0</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #4a90e2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .loading-text {
      font-size: 18px;
      color: #4a90e2;
      text-align: center;
      margin-bottom: 10px;
    }
    .loading-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      max-width: 300px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- This script installs service_worker.js to provide PWA functionality.
       It is generated by the Flutter build process. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  
  <!-- Loading screen -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Digital Vault Heritage v3.0</div>
    <div class="loading-subtitle">Initializing secure vault system...</div>
  </div>

  <!-- Flutter app entry point -->
  <script src="main.dart.js" type="application/javascript"></script>
  
  <script>
    // Hide loading screen when Flutter app loads
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
        }
      }, 3000);
    });
  </script>
</body>
</html>
